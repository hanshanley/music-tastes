[project]
name = "music-tastes"
version = "0.1.0"
description = "Are US hit songs getting sadder, and are fewer of them about love?"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Local inference only. There is no hosted-LLM dependency: the stance classifier
# is a 435M-parameter NLI model run on-device.
models = ["sentence-transformers>=3.0", "transformers>=4.40", "torch>=2.2"]
lang = ["langdetect>=1.0.9", "wordfreq>=3.0"]
test = ["pytest>=8.0"]
notebook = ["jupyter>=1.0"]
# Everything needed to run the full documented pipeline end to end.
all = [
    "sentence-transformers>=3.0", "transformers>=4.40", "torch>=2.2",
    "langdetect>=1.0.9", "wordfreq>=3.0",
]

[project.scripts]
music-tastes = "music_tastes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_tastes"]
